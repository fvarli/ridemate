name: ridemate
description: "RideMate — trust-first community ride sharing for Istanbul."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  intl: any
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Runs flutter gen-l10n as part of the build. See l10n.yaml.
  generate: true

  assets:
    # Approved icon artwork extracted from the design source, normalized to
    # currentColor. See lib/core/icons/rm_icons.dart.
    - assets/icons/
    - assets/brand/

  # Bundled locally on purpose — no runtime font fetching. See assets/fonts/README.md.
  fonts:
    # Prose and UI.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    # Data only: prices, trust scores, percentages, times, plates, counts, distances.
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
