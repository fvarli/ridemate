name: ridemate
description: "RideMate — trust-first community ride sharing for Istanbul."
publish_to: 'none'
version: 0.1.0+1

# Two different kinds of version decision live in this file, and they are not
# the same thing:
#
#   * values INHERITED from the Flutter SDK on purpose — minSdk, targetSdk and
#     compileSdk in android/app/build.gradle.kts. The generated values are the
#     intended baseline; see docs/release/RELEASE_IDENTITY.md.
#   * values pinned here for REPRODUCIBILITY — every direct dependency below,
#     plus pubspec.lock, which is committed.
#
# The Flutter toolchain itself cannot be pinned from a pubspec: `flutter` here
# is a floor, not an exact version. The exact version is pinned in
# .github/workflows/check.yml and recorded in README.md. No version manager is
# introduced for it.
environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  # The refresh credential and session id, and nothing else. Confined to
  # lib/core/session/credential_store.dart by a test: its types never cross the
  # CredentialStore interface, so the platform plugin stays replaceable.
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  # The transport for lib/core/api, and an implementation detail of it: no
  # feature directory imports this, and a test enforces that. Already present
  # transitively through flutter_svg, so this promotes it to a direct
  # dependency rather than pulling anything new in.
  http: ^1.6.0
  # DELIBERATELY UNPINNED. flutter_localizations pins intl to an exact version
  # (0.20.2 as of Flutter 3.41.1), so `any` is what lets the SDK own it. A
  # caret range resolves identically today and breaks `pub get` the day
  # Flutter bumps that pin.
  intl: any
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Runs flutter gen-l10n as part of the build. See l10n.yaml.
  generate: true

  assets:
    # Approved icon artwork extracted from the design source, normalized to
    # currentColor. See lib/core/icons/rm_icons.dart.
    - assets/icons/
    - assets/brand/

  # Bundled locally on purpose — no runtime font fetching. See assets/fonts/README.md.
  fonts:
    # Prose and UI.
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope-ExtraBold.ttf
          weight: 800
    # Data only: prices, trust scores, percentages, times, plates, counts, distances.
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
